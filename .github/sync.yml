name: Sync to the latest state of the upstream SVN repository

on:
  # schedule:
  #   - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: write-all

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v32
        with:
          nix_conf: experimental-features = nix-command flakes
      - name: Build data
        run: |
          nix develop -c bash sync.sh
        env:
          DOWNSTREAM_SYNC_TOKEN: ${{ secrets.TOM7MISC_SYNC_TOKEN }}
